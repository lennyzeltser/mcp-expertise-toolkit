version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    # Wait a week after a release before proposing it, so a pulled or
    # compromised release is less likely to reach a bump PR.
    cooldown:
      default-days: 7
    reviewers:
      - "lennyzeltser"
    commit-message:
      prefix: "deps"
    groups:
      cloudflare:
        patterns:
          - "@cloudflare/*"
          - "wrangler"
      dev-tools:
        patterns:
          - "@biomejs/*"
          - "typescript"
          - "@types/*"
